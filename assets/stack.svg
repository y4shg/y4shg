<svg viewBox="0 0 1000 248" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical stack">
  <style>
    :root { --ink: #1a1a1a; --soft: #6e6e6e; --faint: #a8a8a8; --line: #c9c9c9; --wash: #f1f1f1; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --soft: #9a9a9a; --faint: #5f5f5f; --line: #3a3a3a; --wash: #161616; } }
    .serif { font-family: Georgia, 'Charter', 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rule { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    .blink { animation: blink 1.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } .rule { animation: none; stroke-dashoffset: 0; } .blink { animation: none; } }
  </style>

  <line x1="196" y1="12" x2="196" y2="236" stroke="var(--line)" opacity=".5"/>

  <g class="rise a1">
    <text class="mono" x="48" y="44" font-size="12" fill="var(--soft)" letter-spacing="2">LANGUAGES</text>
    <text class="mono" x="220" y="44" font-size="15" fill="var(--ink)">Python · JavaScript · TypeScript · Java · C++ · Dart</text>
  </g>
  <g class="rise a2">
    <text class="mono" x="48" y="78" font-size="12" fill="var(--soft)" letter-spacing="2">FRONTEND</text>
    <text class="mono" x="220" y="78" font-size="15" fill="var(--ink)">React · Next.js · Astro · Flutter · React Native · HTML / CSS</text>
  </g>
  <g class="rise a3">
    <text class="mono" x="48" y="112" font-size="12" fill="var(--soft)" letter-spacing="2">AI + VISION</text>
    <text class="mono" x="220" y="112" font-size="15" fill="var(--ink)">PyTorch · TensorFlow · OpenCV · Pandas</text>
  </g>
  <g class="rise a4">
    <text class="mono" x="48" y="146" font-size="12" fill="var(--soft)" letter-spacing="2">BACKEND</text>
    <text class="mono" x="220" y="146" font-size="15" fill="var(--ink)">Node.js · Flask · MongoDB · MySQL</text>
  </g>
  <g class="rise a5">
    <text class="mono" x="48" y="180" font-size="12" fill="var(--soft)" letter-spacing="2">CLOUD + OPS</text>
    <text class="mono" x="220" y="180" font-size="15" fill="var(--ink)">Docker · Kubernetes · Azure · GCP · Nginx</text>
  </g>
  <g class="rise a6">
    <text class="mono" x="48" y="214" font-size="12" fill="var(--soft)" letter-spacing="2">CRAFT</text>
    <text class="mono" x="220" y="214" font-size="15" fill="var(--ink)">Figma · Illustrator · Photoshop · Arduino · Bash · Git</text>
  </g>

</svg>
