<svg viewBox="0 0 1000 570" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Five projects by Yash Ghule">
  <style>
    :root { --ink: #1a1a1a; --soft: #6e6e6e; --faint: #a8a8a8; --line: #c9c9c9; --wash: #f1f1f1; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --soft: #9a9a9a; --faint: #5f5f5f; --line: #3a3a3a; --wash: #161616; } }
    .serif { font-family: Georgia, 'Charter', 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rule { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .row { opacity: 0; animation: reveal .55s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes reveal { to { opacity: 1; } }
    .r1{animation-delay:.05s} .r2{animation-delay:.1s} .r3{animation-delay:.15s} .r4{animation-delay:.2s} .r5{animation-delay:.25s}
    .copy { fill: var(--ink); font-size: 12.5px; } .meta { fill: var(--soft); font-size: 11px; letter-spacing: .4px; }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1; } .rule { animation: none; stroke-dashoffset: 0; } }
  </style>
  <g>
    <g class="row r1" transform="translate(0 0)">
      <text class="serif" font-style="italic" x="48" y="30" font-size="26" fill="var(--ink)">01 / JYOTIGPT</text>
      <text class="copy mono" x="48" y="58">Self-hosted meditation AI — a calm space for reflection and private, offline use.</text>
      <text class="meta mono" x="48" y="80">AI · WEB · OPEN SOURCE</text>
      <line class="rule" x1="48" y1="96" x2="952" y2="96"/>
    </g>
    <g class="row r2" transform="translate(0 112)">
      <text class="serif" font-style="italic" x="48" y="30" font-size="26" fill="var(--ink)">02 / JYOTIGPT-DASHBOARD</text>
      <text class="copy mono" x="48" y="58">Ops console for JyotiGPT services — auth, analytics and Spaces management.</text>
      <text class="meta mono" x="48" y="80">OPS · DASHBOARD</text>
      <line class="rule" x1="48" y1="96" x2="952" y2="96"/>
    </g>
    <g class="row r3" transform="translate(0 224)">
      <text class="serif" font-style="italic" x="48" y="30" font-size="26" fill="var(--ink)">03 / SIDEWALKBOT</text>
      <text class="copy mono" x="48" y="58">Sidewalk-following robot — perception and motion, tested on real pavement.</text>
      <text class="meta mono" x="48" y="80">ROBOTICS</text>
      <line class="rule" x1="48" y1="96" x2="952" y2="96"/>
    </g>
    <g class="row r4" transform="translate(0 336)">
      <text class="serif" font-style="italic" x="48" y="30" font-size="26" fill="var(--ink)">04 / WEBUIDATA</text>
      <text class="copy mono" x="48" y="58">Web data sketches — collecting and shaping what the web leaves behind.</text>
      <text class="meta mono" x="48" y="80">DATA · WEB</text>
      <line class="rule" x1="48" y1="96" x2="952" y2="96"/>
    </g>
    <g class="row r5" transform="translate(0 448)">
      <text class="serif" font-style="italic" x="48" y="30" font-size="26" fill="var(--ink)">05 / Y4SHG</text>
      <text class="copy mono" x="48" y="58">This profile — a monochrome folio that redraws itself in light and dark.</text>
      <text class="meta mono" x="48" y="80">PROFILE</text>
      <line class="rule" x1="48" y1="96" x2="952" y2="96"/>
    </g>
  </g>
</svg>
