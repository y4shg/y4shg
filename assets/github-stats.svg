<svg viewBox="0 0 1000 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub statistics and repository languages">
  <style>
    :root { --ink: #1a1a1a; --soft: #6e6e6e; --faint: #a8a8a8; --line: #c9c9c9; --wash: #f1f1f1; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --soft: #9a9a9a; --faint: #5f5f5f; --line: #3a3a3a; --wash: #161616; } }
    .serif { font-family: Georgia, 'Charter', 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rule { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    .blink { animation: blink 1.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } .rule { animation: none; stroke-dashoffset: 0; } .blink { animation: none; } }
  </style>

  <style>
    .panel { fill: none; stroke: var(--line); stroke-width: 1; }
    .grow { transform: scaleX(0); transform-origin: 660px 0; animation: grow .8s cubic-bezier(.2,.7,.2,1) forwards; }
    .g2{animation-delay:.1s} .g3{animation-delay:.2s} .g4{animation-delay:.3s} .g5{animation-delay:.4s}
    @keyframes grow { to { transform: scaleX(1); } }
  </style>
  <rect class="panel" x="24" y="20" width="456" height="270"/>
  <rect class="panel" x="520" y="20" width="456" height="270"/>
  <g class="mono" fill="var(--ink)">
    <text class="serif" font-style="italic" x="52" y="60" font-size="24">y4shg, by the numbers</text>
    <line x1="52" y1="74" x2="452" y2="74" stroke="var(--line)"/>
    <text x="52" y="114" font-size="11" letter-spacing="1" fill="var(--soft)">PUBLIC REPOS</text><text x="436" y="114" font-size="13" text-anchor="end">8</text>
    <text x="52" y="150" font-size="11" letter-spacing="1" fill="var(--soft)">TOTAL STARS</text><text x="436" y="150" font-size="13" text-anchor="end">4</text>
    <text x="52" y="186" font-size="11" letter-spacing="1" fill="var(--soft)">FOLLOWERS</text><text x="436" y="186" font-size="13" text-anchor="end">3</text>
    <text x="52" y="222" font-size="11" letter-spacing="1" fill="var(--soft)">FOLLOWING</text><text x="436" y="222" font-size="13" text-anchor="end">2</text>
    <text x="52" y="258" font-size="11" letter-spacing="1" fill="var(--soft)">ASK ME ABOUT</text><text x="436" y="258" font-size="11" text-anchor="end">flutter &#183; pytorch &#183; react</text>
    <text class="serif" font-style="italic" x="548" y="60" font-size="24">languages by repo</text>
    <line x1="548" y1="74" x2="948" y2="74" stroke="var(--line)"/>
    <text x="548" y="108" font-size="10" fill="var(--soft)">JAVASCRIPT</text><rect x="660" y="97" width="270" height="12" fill="none" stroke="var(--line)"/><rect class="fill grow" x="660" y="97" width="90" height="12" fill="var(--ink)"/>
    <text x="548" y="144" font-size="10" fill="var(--soft)">TYPESCRIPT</text><rect x="660" y="133" width="270" height="12" fill="none" stroke="var(--line)"/><rect class="fill grow g2" x="660" y="133" width="90" height="12" fill="var(--ink)"/>
    <text x="548" y="180" font-size="10" fill="var(--soft)">PYTHON</text><rect x="660" y="169" width="270" height="12" fill="none" stroke="var(--line)"/><rect class="fill grow g3" x="660" y="169" width="90" height="12" fill="var(--ink)"/>
    <text x="548" y="216" font-size="10" fill="var(--soft)">HTML</text><rect x="660" y="205" width="270" height="12" fill="none" stroke="var(--line)"/><rect class="fill grow g4" x="660" y="205" width="45" height="12" fill="var(--ink)"/>
    <text x="548" y="252" font-size="10" fill="var(--soft)">C++</text><rect x="660" y="241" width="270" height="12" fill="none" stroke="var(--line)"/><rect class="fill grow g5" x="660" y="241" width="45" height="12" fill="var(--ink)"/>
  </g>

</svg>
