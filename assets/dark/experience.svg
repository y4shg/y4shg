<svg viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience — projects and practice">
  <style>
    :root { --ink: #1a1a1a; --soft: #6e6e6e; --faint: #a8a8a8; --line: #c9c9c9; --wash: #f1f1f1; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --soft: #9a9a9a; --faint: #5f5f5f; --line: #3a3a3a; --wash: #161616; } }
    .serif { font-family: Georgia, 'Charter', 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rule { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    .blink { animation: blink 1.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } .rule { animation: none; stroke-dashoffset: 0; } .blink { animation: none; } }
  </style>

  <line x1="120" y1="14" x2="120" y2="346" stroke="var(--line)" opacity=".5"/>

  <g class="rise a1">
    <text class="mono" x="48" y="46" font-size="12" fill="var(--soft)" letter-spacing="2">2026</text>
    <text class="serif" font-style="italic" x="140" y="48" font-size="19" fill="var(--ink)">JyotiGPT · Solo builder</text>
    <text class="mono" x="140" y="72" font-size="13.5" fill="var(--soft)">self-hosted meditation AI — calm WebUI, guided reflection, offline-first private AI</text>
  </g>
  <g class="rise a2">
    <text class="mono" x="48" y="108" font-size="12" fill="var(--soft)" letter-spacing="2">2026</text>
    <text class="serif" font-style="italic" x="140" y="110" font-size="19" fill="var(--ink)">JyotiGPT Dashboard · Solo builder</text>
    <text class="mono" x="140" y="134" font-size="13.5" fill="var(--soft)">Flask ops console — auth, analytics integration, HuggingFace Spaces management</text>
  </g>
  <g class="rise a3">
    <text class="mono" x="48" y="170" font-size="12" fill="var(--soft)" letter-spacing="2">2026</text>
    <text class="serif" font-style="italic" x="140" y="172" font-size="19" fill="var(--ink)">BabaBot · Solo builder</text>
    <text class="mono" x="140" y="196" font-size="13.5" fill="var(--soft)">community Q&#38;A helper bot — small, friendly, always awake</text>
  </g>
  <g class="rise a4">
    <text class="mono" x="48" y="232" font-size="12" fill="var(--soft)" letter-spacing="2">2025</text>
    <text class="serif" font-style="italic" x="140" y="234" font-size="19" fill="var(--ink)">SidewalkBot · Robotics</text>
    <text class="mono" x="140" y="258" font-size="13.5" fill="var(--soft)">sidewalk-following robot — perception, motion, pavement trials</text>
  </g>
  <g class="rise a5">
    <text class="mono" x="48" y="294" font-size="12" fill="var(--soft)" letter-spacing="2">2024 –</text>
    <text class="serif" font-style="italic" x="140" y="296" font-size="19" fill="var(--ink)">Independent developer · Open source</text>
    <text class="mono" x="140" y="320" font-size="13.5" fill="var(--soft)">frontend builds, cross-platform apps, learning in public</text>
  </g>

</svg>
