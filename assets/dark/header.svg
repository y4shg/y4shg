<svg viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Yash Ghule — Frontend Developer">
  <style>
    :root { --ink: #1a1a1a; --soft: #6e6e6e; --faint: #a8a8a8; --line: #c9c9c9; --wash: #f1f1f1; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --soft: #9a9a9a; --faint: #5f5f5f; --line: #3a3a3a; --wash: #161616; } }
    .serif { font-family: Georgia, 'Charter', 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rule { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    .blink { animation: blink 1.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } .rule { animation: none; stroke-dashoffset: 0; } .blink { animation: none; } }
  </style>

  <line class="rule a1" x1="48" y1="60" x2="952" y2="60"/>
  <line class="rule a1" x1="48" y1="66" x2="952" y2="66"/>
  <g class="rise a2">
    <text class="serif" font-style="italic" fill="var(--ink)" x="44" y="188" font-size="104" letter-spacing="-1">Yash Ghule<tspan fill="var(--soft)">.</tspan></text>
  </g>
  <g class="rise a3">
    <text class="mono" fill="var(--soft)" x="48" y="232" font-size="19">frontend developer &#8212; building for the web, robots &#38; beyond.</text>
  </g>
  <g class="rise a4">
    <rect x="48" y="258" width="9" height="18" fill="var(--ink)"/>
    <text class="mono" fill="var(--ink)" x="68" y="273" font-size="14" letter-spacing="1">now &#8212; JyotiGPT</text>
  </g>
  <g class="rise a5">
    <text class="mono" fill="var(--faint)" x="48" y="302" font-size="13" letter-spacing="1">open to collaboration &#183; vovxb@vovxb.eu</text>
  </g>
  <line class="rule a5" x1="48" y1="338" x2="952" y2="338"/>
  <g class="rise a6">
    <text class="mono" fill="var(--soft)" x="48" y="372" font-size="11.5" letter-spacing="3">FRONTEND &#38; REACT</text>
    <text class="mono" fill="var(--faint)" x="262" y="372" font-size="11.5">/</text>
    <text class="mono" fill="var(--soft)" x="282" y="372" font-size="11.5" letter-spacing="3">ROBOTICS &#38; AI</text>
    <text class="mono" fill="var(--faint)" x="452" y="372" font-size="11.5">/</text>
    <text class="mono" fill="var(--soft)" x="472" y="372" font-size="11.5" letter-spacing="3">OPEN SOURCE</text>
  </g>

</svg>
