<svg viewBox="0 0 1200 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Timeline — 2024 first commit to now">
  <style>
    :root { --ink: #1a1a1a; --soft: #6e6e6e; --faint: #a8a8a8; --line: #c9c9c9; --wash: #f1f1f1; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --soft: #9a9a9a; --faint: #5f5f5f; --line: #3a3a3a; --wash: #161616; } }
    .serif { font-family: Georgia, 'Charter', 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rule { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    .blink { animation: blink 1.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } .rule { animation: none; stroke-dashoffset: 0; } .blink { animation: none; } }
  </style>

  <line class="rule a1" x1="48" y1="40" x2="1152" y2="40"/>
  <text class="mono rise a1" fill="var(--soft)" x="48" y="28" font-size="11" letter-spacing="3.5">THE ROUTE SO FAR</text>
  <text class="mono rise a1" fill="var(--soft)" x="1152" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 03</text>
  <line class="rule a2" x1="48" y1="140" x2="1158" y2="140"/>
  
    <g class="rise a2">
      <circle cx="100" cy="140" r="4" fill="var(--ink)"/>
      <line x1="100" y1="136" x2="100" y2="108" stroke="var(--line)"/>
      <text class="mono" fill="var(--ink)" x="100" y="86" font-size="11" letter-spacing="2" text-anchor="middle">2024</text>
      <text class="mono" fill="var(--soft)" x="100" y="102" font-size="10.5" text-anchor="middle">first commit · joins GitHub</text>
    </g>
    <g class="rise a3">
      <circle cx="330" cy="140" r="4" fill="var(--ink)"/>
      <line x1="330" y1="144" x2="330" y2="172" stroke="var(--line)"/>
      <text class="mono" fill="var(--ink)" x="330" y="190" font-size="11" letter-spacing="2" text-anchor="middle">2025</text>
      <text class="mono" fill="var(--soft)" x="330" y="206" font-size="10.5" text-anchor="middle">SidewalkBot · robotics era</text>
    </g>
    <g class="rise a4">
      <circle cx="560" cy="140" r="4" fill="var(--ink)"/>
      <line x1="560" y1="136" x2="560" y2="108" stroke="var(--line)"/>
      <text class="mono" fill="var(--ink)" x="560" y="86" font-size="11" letter-spacing="2" text-anchor="middle">2026</text>
      <text class="mono" fill="var(--soft)" x="560" y="102" font-size="10.5" text-anchor="middle">JyotiGPT · dashboard · Bababot</text>
    </g>
    <g class="rise a5">
      <circle cx="790" cy="140" r="4" fill="var(--ink)"/>
      <line x1="790" y1="144" x2="790" y2="172" stroke="var(--line)"/>
      <text class="mono" fill="var(--ink)" x="790" y="190" font-size="11" letter-spacing="2" text-anchor="middle">NOW</text>
      <text class="mono" fill="var(--soft)" x="790" y="206" font-size="10.5" text-anchor="middle">shipping · learning py + java</text>
    </g>
  <g class="rise a6">
    <circle class="blink" cx="1060" cy="140" r="5" fill="var(--ink)"/>
    <text class="mono" fill="var(--faint)" x="1152" y="120" font-size="10" letter-spacing="2" text-anchor="end">2028 &#8594;</text>
    <text class="serif" font-style="italic" fill="var(--soft)" x="1152" y="168" font-size="18" text-anchor="end">to be continued&#8230;</text>
  </g>

</svg>
