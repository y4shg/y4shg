<svg viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Workspace — everything from one desk">
  <style>
    :root { --ink: #1a1a1a; --soft: #6e6e6e; --faint: #a8a8a8; --line: #c9c9c9; --wash: #f1f1f1; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --soft: #9a9a9a; --faint: #5f5f5f; --line: #3a3a3a; --wash: #161616; } }
    .serif { font-family: Georgia, 'Charter', 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rule { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    .blink { animation: blink 1.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } .rule { animation: none; stroke-dashoffset: 0; } .blink { animation: none; } }
  </style>

  <line class="rule a1" x1="48" y1="40" x2="952" y2="40"/>
  <text class="mono rise a1" fill="var(--soft)" x="48" y="28" font-size="11" letter-spacing="3.5">WORKSPACE &#8212; ONE DESK, MANY MACHINES</text>
  <text class="mono rise a1" fill="var(--soft)" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 01</text>
  <line class="rule a2" x1="48" y1="94" x2="952" y2="94"/>
  <g class="rise a1">
    <rect x="118" y="120" width="202" height="120" fill="none" stroke="var(--line)" stroke-width="1"/>
    <rect x="118" y="120" width="202" height="34" fill="var(--wash)"/>
    <text class="mono" x="130" y="143" font-size="12" letter-spacing="1.5" fill="var(--ink)">JYOTIGPT</text>
    <text class="mono" x="130" y="182" font-size="11.5" fill="var(--soft)">meditation AI platform</text>
    <text class="mono" x="130" y="220" font-size="10.5" letter-spacing="2" fill="var(--faint)">JS ★2</text>
    <line x1="219" y1="94" x2="219" y2="120" stroke="var(--line)"/>
  </g>
  <g class="rise a2">
    <rect x="399" y="120" width="202" height="120" fill="none" stroke="var(--line)" stroke-width="1"/>
    <rect x="399" y="120" width="202" height="34" fill="var(--wash)"/>
    <text class="mono" x="411" y="143" font-size="12" letter-spacing="1.5" fill="var(--ink)">DASHBOARD</text>
    <text class="mono" x="411" y="182" font-size="11.5" fill="var(--soft)">flask ops console</text>
    <text class="mono" x="411" y="220" font-size="10.5" letter-spacing="2" fill="var(--faint)">PYTHON</text>
    <line x1="500" y1="94" x2="500" y2="120" stroke="var(--line)"/>
  </g>
  <g class="rise a3">
    <rect x="680" y="120" width="202" height="120" fill="none" stroke="var(--line)" stroke-width="1"/>
    <rect x="680" y="120" width="202" height="34" fill="var(--wash)"/>
    <text class="mono" x="692" y="143" font-size="12" letter-spacing="1.5" fill="var(--ink)">SIDEWALKBOT</text>
    <text class="mono" x="692" y="182" font-size="11.5" fill="var(--soft)">sidewalk robot</text>
    <text class="mono" x="692" y="220" font-size="10.5" letter-spacing="2" fill="var(--faint)">C++</text>
    <line x1="781" y1="94" x2="781" y2="120" stroke="var(--line)"/>
  </g>
  <line class="rule a3" x1="48" y1="266" x2="952" y2="266"/>
  <g class="rise a4">
    <rect x="259" y="292" width="202" height="120" fill="none" stroke="var(--line)" stroke-width="1"/>
    <rect x="259" y="292" width="202" height="34" fill="var(--wash)"/>
    <text class="mono" x="271" y="315" font-size="12" letter-spacing="1.5" fill="var(--ink)">WEBUIDATA</text>
    <text class="mono" x="271" y="354" font-size="11.5" fill="var(--soft)">web data lab</text>
    <text class="mono" x="271" y="392" font-size="10.5" letter-spacing="2" fill="var(--faint)">—</text>
    <line x1="360" y1="266" x2="360" y2="292" stroke="var(--line)"/>
  </g>
  <g class="rise a5">
    <rect x="540" y="292" width="202" height="120" fill="none" stroke="var(--line)" stroke-width="1"/>
    <rect x="540" y="292" width="202" height="34" fill="var(--wash)"/>
    <text class="mono" x="552" y="315" font-size="12" letter-spacing="1.5" fill="var(--ink)">Y4SHG</text>
    <text class="mono" x="552" y="354" font-size="11.5" fill="var(--soft)">this profile</text>
    <text class="mono" x="552" y="392" font-size="10.5" letter-spacing="2" fill="var(--faint)">MD</text>
    <line x1="641" y1="266" x2="641" y2="292" stroke="var(--line)"/>
  </g>
  <g class="rise a5">
    <text class="mono" x="48" y="404" font-size="11" fill="var(--soft)" letter-spacing="2">WEB &#183; AI &#183; ROBOTICS &#8212; every box ships from the same desk</text>
  </g>
</svg>
