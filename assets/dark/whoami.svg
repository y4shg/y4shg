<svg viewBox="0 0 1000 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status, contact">
  <style>
    :root { --ink: #1a1a1a; --soft: #6e6e6e; --faint: #a8a8a8; --line: #c9c9c9; --wash: #f1f1f1; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --soft: #9a9a9a; --faint: #5f5f5f; --line: #3a3a3a; --wash: #161616; } }
    .serif { font-family: Georgia, 'Charter', 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rule { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    .blink { animation: blink 1.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } .rule { animation: none; stroke-dashoffset: 0; } .blink { animation: none; } }
  </style>

  <g class="rise a1">
    <text class="serif" font-style="italic" x="48" y="42" font-size="24" fill="var(--ink)">frontend developer from the USA.</text>
  </g>
  <g class="rise a2">
    <text class="mono" x="48" y="74" font-size="15" fill="var(--ink)">I build for the web &#8212; simple, tactile, human.</text>
    <text class="mono" x="48" y="100" font-size="15" fill="var(--ink)">into interfaces, machines and open source.</text>
    <text class="mono" x="48" y="126" font-size="14" fill="var(--soft)">clean interfaces, curious machines, open source everything.</text>
  </g>
  <line class="rule a3" x1="48" y1="150" x2="952" y2="150"/>
  <g class="rise a3">
    <text class="mono" x="48" y="182" font-size="11" fill="var(--soft)" letter-spacing="2.5">FOCUS &#8594;</text>
    <text class="mono" x="150" y="182" font-size="15" fill="var(--ink)">frontend &#183; robotics &#38; AI &#183; open-source tooling</text>
  </g>
  <g class="rise a4">
    <text class="mono" x="48" y="212" font-size="11" fill="var(--soft)" letter-spacing="2.5">NOW &#8594;</text>
    <text class="mono" x="150" y="212" font-size="15" fill="var(--ink)">JyotiGPT</text>
  </g>
  <g class="rise a5">
    <text class="mono" x="48" y="240" font-size="11" fill="var(--soft)" letter-spacing="2.5">PING &#8594;</text>
    <text class="mono" x="150" y="240" font-size="15" fill="var(--ink)">vovxb@vovxb.eu &#183; laap.top</text>
  </g>

</svg>
