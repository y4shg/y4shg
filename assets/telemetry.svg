<svg viewBox="0 0 1000 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry — stack mix, shipping curve, counters">
  <style>
    :root { --ink: #1a1a1a; --soft: #6e6e6e; --faint: #a8a8a8; --line: #c9c9c9; --wash: #f1f1f1; }
    @media (prefers-color-scheme: dark) { :root { --ink: #ececec; --soft: #9a9a9a; --faint: #5f5f5f; --line: #3a3a3a; --wash: #161616; } }
    .serif { font-family: Georgia, 'Charter', 'Times New Roman', serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .rule { stroke: var(--line); stroke-width: 1; stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.5s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    .blink { animation: blink 1.6s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } .rule { animation: none; stroke-dashoffset: 0; } .blink { animation: none; } }
  </style>

  <style>
    .bar { transform: scaleX(0); transform-origin: 200px 0; animation: grow 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .g1{animation-delay:.3s} .g2{animation-delay:.42s} .g3{animation-delay:.54s} .g4{animation-delay:.66s} .g5{animation-delay:.78s} .g6{animation-delay:.9s}
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards; }
    .dot { opacity: 0; animation: fade .4s ease forwards; }
    .d1{animation-delay:1s} .d2{animation-delay:1.3s} .d3{animation-delay:1.6s} .d4{animation-delay:1.9s}
    @keyframes fade { to { opacity: 1; } }
  </style>
  <line class="rule a1" x1="48" y1="40" x2="952" y2="40"/>
  <text class="mono rise a1" fill="var(--soft)" x="48" y="28" font-size="11" letter-spacing="3.5">TELEMETRY &#8212; WHAT THE HANDS ARE DOING</text>
  <text class="mono rise a1" fill="var(--soft)" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 02</text>
  <line x1="560" y1="64" x2="560" y2="300" stroke="var(--line)" opacity=".5"/>
  <text class="mono" fill="var(--faint)" x="48" y="80" font-size="10" letter-spacing="2.5">STACK MIX &#183; EST.</text>
  
    <text class="mono" fill="var(--ink)" x="48" y="112" font-size="11">javascript</text>
    <rect class="bar g1" x="200" y="120" width="200" height="7" fill="var(--ink)"/>
    <text class="mono" fill="var(--soft)" x="412" y="127" font-size="10">25%</text>
    <text class="mono" fill="var(--ink)" x="48" y="146" font-size="11">python</text>
    <rect class="bar g2" x="200" y="154" width="175" height="7" fill="var(--ink)"/>
    <text class="mono" fill="var(--soft)" x="387" y="161" font-size="10">22%</text>
    <text class="mono" fill="var(--ink)" x="48" y="180" font-size="11">typescript</text>
    <rect class="bar g3" x="200" y="188" width="150" height="7" fill="var(--ink)"/>
    <text class="mono" fill="var(--soft)" x="362" y="195" font-size="10">19%</text>
    <text class="mono" fill="var(--ink)" x="48" y="214" font-size="11">c++ · html</text>
    <rect class="bar g4" x="200" y="222" width="120" height="7" fill="var(--ink)"/>
    <text class="mono" fill="var(--soft)" x="332" y="229" font-size="10">15%</text>
    <text class="mono" fill="var(--ink)" x="48" y="248" font-size="11">dart · java</text>
    <rect class="bar g5" x="200" y="256" width="95" height="7" fill="var(--ink)"/>
    <text class="mono" fill="var(--soft)" x="307" y="263" font-size="10">12%</text>
    <text class="mono" fill="var(--ink)" x="48" y="282" font-size="11">other</text>
    <rect class="bar g6" x="200" y="290" width="60" height="7" fill="var(--ink)"/>
    <text class="mono" fill="var(--soft)" x="272" y="297" font-size="10">7%</text>
  <text class="mono" fill="var(--faint)" x="592" y="80" font-size="10" letter-spacing="2.5">SHIPPING CURVE &#183; 2024 &#8594; 2026</text>
  <line x1="592" y1="252" x2="920" y2="252" stroke="var(--line)"/>
  <polyline class="spark" points="592,240 660,228 730,200 800,160 860,120 920,96" stroke="var(--ink)" stroke-width="1.5"/>
  <circle class="dot d1" cx="660" cy="228" r="3" fill="var(--ink)"/>
  <circle class="dot d2" cx="730" cy="200" r="3" fill="var(--ink)"/>
  <circle class="dot d3" cx="800" cy="160" r="3" fill="var(--ink)"/>
  <circle class="dot d4" cx="920" cy="96" r="4" fill="var(--ink)"/>
  <text class="mono" fill="var(--soft)" x="592" y="276" font-size="10" letter-spacing="1.5">'24</text>
  <text class="mono" fill="var(--soft)" x="744" y="276" font-size="10" letter-spacing="1.5">'25</text>
  <text class="mono" fill="var(--soft)" x="904" y="276" font-size="10" letter-spacing="1.5">'26</text>
  <g class="rise a4">
    <text class="serif" font-style="italic" fill="var(--ink)" x="592" y="322" font-size="26">8 repos &#183; 4 stars &#183; trend &#8212; accelerating</text>
  </g>

</svg>
